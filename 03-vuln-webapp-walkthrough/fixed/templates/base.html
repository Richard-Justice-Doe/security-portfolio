<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Northridge Lost &amp; Found{% endblock %}</title>
  <style>
    body { font: 16px/1.5 "Segoe UI", system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #102033; }
    .banner { background: #7a1020; color: #fff; padding: 0.6rem 0.8rem; border-radius: 8px; font-size: 0.85rem; }
    nav { display: flex; gap: 1rem; margin: 1rem 0; }
    .card { border: 1px solid #d5dde6; border-radius: 10px; padding: 1rem 1.2rem; }
    input, button { font: inherit; padding: 0.4rem 0.6rem; }
    button { background: #1d4e89; color: #fff; border: 0; border-radius: 6px; }
    .error { color: #7a1020; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.4rem 0; border-bottom: 1px solid #e6ebf0; }
  </style>
</head>
<body>
  <p class="banner">{{ warning }}</p>
  <h1>Northridge Campus Lost &amp; Found</h1>
  <nav>
    <a href="{{ url_for('home') }}">Board</a>
    <a href="{{ url_for('login') }}">Login</a>
    <a href="{{ url_for('admin') }}">Staff admin</a>
    <a href="{{ url_for('logout') }}">Logout</a>
  </nav>
  {% block body %}{% endblock %}
</body>
</html>
